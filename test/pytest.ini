[pytest]
testpaths = selenium
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --html=reports/test_report.html
    --self-contained-html
markers =
    smoke: Smoke/navigation tests
    functional: Functional CRUD tests
    negative: Negative/error-path tests
    boundary: Boundary/edge-case tests
    ui: UI/UX interaction tests
