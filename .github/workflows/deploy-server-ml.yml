name: Deploy Server ML to Cloud Run

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'server-ml/**'
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-server-ml]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: server-ml
  IMAGE_NAME: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/drone-images/server-ml

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Build and Push Container
        run: |
          cd server-ml
          BUILD_ID="$(gcloud builds submit --tag '${{ env.IMAGE_NAME }}' --async --format='value(id)' .)"
          echo "Cloud Build started: ${BUILD_ID}"
          # Avoid Cloud Build "get_requests" rate limits by waiting with backoff.
          for i in 1 2 3 4 5; do
            if gcloud builds wait "${BUILD_ID}" --timeout="3600s"; then
              break
            fi
            echo "Build wait failed (attempt ${i}); retrying in $((i*15))s..."
            sleep $((i*15))
          done

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --memory 2Gi

