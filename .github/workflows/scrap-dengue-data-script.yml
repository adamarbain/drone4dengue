name: Run Dengue Data Script Daily

on:
  schedule:
    - cron: "0 13 * * *"  # Runs every day at 9pm Malaysia time (UTC+8 = 1pm UTC)
  workflow_dispatch:     # Allows manual trigger from the Actions tab

permissions:
  contents: write  # required to push commits with GITHUB_TOKEN
  
jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas matplotlib geopandas shapely folium plotly pytz scikit-learn joblib seaborn psycopg2-binary

      - name: Run Daily Data Processing Script
        working-directory: daily-scrap-dengue-data
        run: python dailydenguedataprocessing.py

      - name: Train ML Models
        working-directory: daily-scrap-dengue-data
        run: python dengue_ml_models_improved.py

      - name: Store Dengue Data to Database
        working-directory: daily-scrap-dengue-data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python store_dengue_data_to_db.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Daily update: data processing and ML model training" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
